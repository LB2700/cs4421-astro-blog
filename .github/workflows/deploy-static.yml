name: Deploy Static Site via AWS CDK
on:
  push:
    branches: [main, 27-bug-aws-s3-deployment]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Project & CDK Dependencies
        run: npm ci

      - name: Build Astro Static Site
        run: npm run build

      - name: Change Directory to CDK Project
        run: cd cdk && npm ci 

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Infrastructure & Assets with AWS CDK
        run: npx cdk deploy --app "npx ts-node && npx ts-node bin/cdk.ts" --require-approval never
