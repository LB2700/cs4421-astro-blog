name: Deploy Container to AWS

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and run unit tests
        run: |
          npm ci
          npm run test:unit

      - name: Configure AWS credentials
        if: startsWith(github.ref, 'refs/tags/')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: startsWith(github.ref, 'refs/tags/')
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          GITHUB_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:8}-${VERSION}"
          echo "Publishing image with tag: $IMAGE_TAG"
          docker build -t "$ECR_REGISTRY/cs4421/wind-ups:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/cs4421/wind-ups:$IMAGE_TAG"